<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Tayfun Yapı · Cam Balkon</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E293B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cam Balkon">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --teal:#1E293B; --teal-d:#0F172A; --amber:#F59E0B; --amber-d:#D97706; --ink:#1F2937; --muted:#6B7280;
          --line:#E2E8F0; --bg:#F8FAFC; --card:#fff; --field:#F1F5F9; --red:#C8553D; --green:#059669; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:"Segoe UI",Roboto,system-ui,Arial,sans-serif; }
  body { overscroll-behavior-y:contain; }
  #app { max-width:960px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; }
  header.top { position:sticky; top:0; z-index:5; background:var(--teal); color:#fff; padding:calc(env(safe-area-inset-top) + 10px) 14px 12px;
               display:flex; align-items:center; gap:10px; box-shadow:0 2px 10px rgba(0,0,0,.15); }
  header.top h1 { font-size:18px; margin:0; flex:1; font-weight:700; letter-spacing:.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ib { width:40px; height:40px; border-radius:12px; border:0; background:rgba(255,255,255,.14); color:#fff; font-size:20px; display:grid; place-items:center; cursor:pointer; }
  main { flex:1; padding:12px 12px 110px; }
  nav.bottom { position:fixed; left:0; right:0; bottom:0; z-index:6; background:#fff; border-top:1px solid var(--line);
               display:flex; justify-content:center; padding-bottom:env(safe-area-inset-bottom); }
  nav.bottom .in { display:flex; width:100%; max-width:960px; }
  nav.bottom button { flex:1; border:0; background:none; padding:9px 4px 8px; font-size:12px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; }
  nav.bottom button b { font-size:20px; line-height:1; }
  nav.bottom button.on { color:var(--teal); font-weight:700; }
  .search { width:100%; border:2px solid var(--line); background:#fff; border-radius:14px; padding:12px 14px; font-size:16px; margin-bottom:10px; }
  .list { display:grid; grid-template-columns:1fr; gap:10px; }
  @media (min-width:700px) { .list { grid-template-columns:1fr 1fr; } }
  .card { background:var(--card); border-radius:16px; padding:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); border:1px solid #E2E8F0; }
  .card.tap { cursor:pointer; }
  .card.tap:active { transform:scale(.99); }
  .row { display:flex; align-items:center; gap:10px; }
  .grow { flex:1; min-width:0; }
  .t1 { font-weight:700; font-size:16px; }
  .t2 { color:var(--muted); font-size:13px; margin-top:2px; }
  .money { font-weight:800; color:var(--teal); }
  .pill { display:inline-block; font-size:11px; font-weight:700; padding:3px 8px; border-radius:20px; background:#E2E8F0; color:var(--teal-d); }
  .pill.amber { background:#FDEBD5; color:#92400E; }
  .fab { position:fixed; right:max(16px, calc(50% - 464px)); bottom:calc(76px + env(safe-area-inset-bottom)); z-index:7; border:0; border-radius:28px;
         background:var(--amber); color:#fff; font-size:16px; font-weight:700; padding:15px 20px; box-shadow:0 6px 18px rgba(224,145,58,.45); cursor:pointer; }
  .empty { text-align:center; color:var(--muted); padding:40px 10px; }
  label.f { display:block; font-size:12px; color:var(--muted); margin:10px 4px 4px; font-weight:600; }
  input.f, select.f, textarea.f { width:100%; font-size:16px; border:2px solid var(--line); background:var(--field); border-radius:14px; padding:12px 14px; color:var(--ink); }
  textarea.f { min-height:80px; resize:vertical; }
  input.f, select.f, textarea.f { min-width:0; max-width:100%; }
  input[type=date].f, input[type=time].f { -webkit-appearance:none; appearance:none; display:block; min-height:50px; text-align:left; }
  select.f { text-overflow:ellipsis; }
  main { overflow-x:clip; }
  input.f:focus, select.f:focus, textarea.f:focus { outline:none; border-color:var(--teal); background:#fff; }
  .btn { display:block; width:100%; border:0; border-radius:26px; padding:15px; font-size:16px; font-weight:700; color:#fff; background:var(--teal); cursor:pointer; margin-top:14px; }
  .btn.amber { background:var(--amber); } .btn.red { background:var(--red); } .btn.ghost { background:#fff; color:var(--teal); border:2px solid var(--teal); }
  .btn:disabled { opacity:.55; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:0; border-radius:12px; padding:10px 14px; font-size:14px; background:#1F1F1F; color:#fff; cursor:pointer; }
  .chip.on { background:var(--amber); }
  .sec { background:#fff; border:1px solid #E2E8F0; border-radius:14px; margin:10px 0; overflow:hidden; }
  .sec > h3 { margin:0; color:#0F172A; font-size:14px; padding:11px 12px 4px; display:flex; align-items:center; gap:8px; }
  .sec > h3::before { content:""; width:4px; height:15px; border-radius:2px; background:#F59E0B; }
  .sec > .in { padding:10px 12px 12px; }
  .check { display:flex; align-items:center; gap:10px; padding:8px 2px; font-size:15px; }
  .check input { width:22px; height:22px; accent-color:var(--teal); }
  .steps { display:flex; align-items:center; justify-content:center; gap:6px; margin:4px 0 12px; }
  .steps span { min-width:30px; height:30px; padding:0 8px; border-radius:15px; background:#fff; border:1px solid #CBD5E1; color:#64748B; display:grid; place-items:center; font-weight:700; font-size:13px; }
  .steps span.done { background:var(--teal); border-color:var(--teal); color:#fff; }
  .steps span.on { background:#F59E0B; border-color:#F59E0B; color:#fff; }
  .steps i { width:18px; height:2px; background:#CBD5E1; }
  .wbar { position:fixed; left:0; right:0; bottom:0; z-index:8; background:#fff; border-top:1px solid var(--line); padding:10px 14px calc(10px + env(safe-area-inset-bottom)); }
  .wbar .in { max-width:960px; margin:0 auto; display:flex; gap:10px; }
  .wbar button { flex:1; border:0; border-radius:12px; padding:14px; font-size:16px; font-weight:700; cursor:pointer; }
  .wbar .back { background:#F8FAFC; color:#0F172A; flex:0.7; }
  .wbar .next { background:#F59E0B; color:#fff; }
  .seg { display:flex; align-items:center; gap:12px; }
  .seg .n { width:34px; height:34px; border-radius:10px; background:var(--teal); color:#fff; display:grid; place-items:center; font-weight:800; }
  .kv { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .kv > div { background:#fff; border:2px solid var(--line); border-radius:12px; padding:10px; text-align:center; }
  .kv b { display:block; font-size:17px; } .kv small { color:var(--muted); font-size:12px; }
  table.mat { width:100%; border-collapse:collapse; font-size:13px; }
  table.mat td { padding:8px 4px; border-bottom:1px solid #F8FAFC; }
  table.mat td.r { text-align:right; white-space:nowrap; }
  .drawbox { background:#fff; border-radius:14px; border:1px solid var(--line); padding:8px; overflow-x:auto; }
  .drawbox svg { display:block; margin:0 auto; max-width:100%; height:auto; }
  .modal { position:fixed; inset:0; background:rgba(15,23,42,.5); z-index:20; display:flex; align-items:flex-end; justify-content:center; }
  @media (min-width:700px) { .modal { align-items:center; } }
  .sheet { background:#fff; width:100%; max-width:560px; max-height:92vh; overflow:auto; border-radius:22px 22px 0 0; padding:10px 16px calc(18px + env(safe-area-inset-bottom)); }
  @media (min-width:700px) { .sheet { border-radius:22px; } }
  .sheet .grab { width:46px; height:5px; border-radius:3px; background:#CBD5E1; margin:4px auto 10px; }
  .sheet h2 { font-size:18px; margin:0 0 6px; display:flex; align-items:center; }
  .sheet h2 span { flex:1; }
  .x { border:2px solid var(--ink); background:#fff; width:34px; height:34px; border-radius:50%; font-size:16px; cursor:pointer; }
  .toast { position:fixed; left:50%; top:calc(env(safe-area-inset-top) + 70px); transform:translateX(-50%); background:#1F2937; color:#fff; padding:11px 16px;
           border-radius:12px; font-size:14px; z-index:30; opacity:0; transition:opacity .25s; pointer-events:none; max-width:90vw; text-align:center; }
  .toast.show { opacity:1; }
  .loader { position:fixed; inset:0; background:rgba(255,255,255,.75); z-index:25; display:none; place-items:center; }
  .loader.show { display:grid; }
  .loader div { background:#fff; padding:18px 22px; border-radius:16px; box-shadow:0 6px 30px rgba(0,0,0,.15); text-align:center; font-weight:600; }
  .spin { width:34px; height:34px; border:4px solid #CBD5E1; border-top-color:var(--teal); border-radius:50%; margin:0 auto 10px; animation:sp 0.9s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .login { min-height:100vh; display:grid; place-items:center; padding:20px; background:linear-gradient(160deg, #1E293B, #0F172A); }
  .login .card { width:100%; max-width:420px; padding:24px; }
  .logo { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .logo .m { width:52px; height:52px; border-radius:14px; background:var(--teal); display:grid; place-items:center; }
  .note { font-size:13px; color:var(--muted); line-height:1.45; }
  .warn { background:#FFF7E6; color:#8A5A00; border:1px solid #F5D08A; border-radius:12px; padding:10px 12px; font-size:13px; margin-bottom:10px; }

  /* ---- ana sayfa (kendi tasarımımız) ---- */
  .topbar { display:flex; align-items:center; gap:10px; padding:calc(env(safe-area-inset-top) + 12px) 16px 6px; }
  .topbar .lg { width:44px; height:44px; border-radius:12px; background:#fff; border:1px solid var(--line); display:grid; place-items:center; overflow:hidden; flex:none; }
  .topbar .lg img { max-width:100%; max-height:100%; }
  .topbar .co { flex:1; min-width:0; font-weight:700; font-size:14px; color:var(--teal-d); letter-spacing:.4px; text-transform:uppercase;
                white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .topbar .av { width:42px; height:42px; border-radius:50%; border:0; background:var(--teal); color:#fff; font-weight:800; font-size:15px; cursor:pointer; flex:none; }
  .greet { padding:6px 18px 2px; }
  .greet small { color:var(--muted); font-size:14px; }
  .greet h2 { margin:2px 0 0; font-size:27px; font-weight:800; letter-spacing:-.3px; }
  .market { margin:14px 16px 0; background:#fff; border:1px solid #E2E8F0; border-radius:18px; display:grid; grid-template-columns:1fr 1px 1fr; align-items:stretch;
            box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .market > div { padding:12px 14px; cursor:pointer; }
  .market > i { background:#E2E8F0; margin:10px 0; }
  .market small { display:block; font-size:11px; font-weight:700; color:var(--muted); letter-spacing:.6px; text-transform:uppercase; }
  .market b { display:block; font-size:20px; font-weight:800; margin-top:2px; color:var(--ink); }
  .market em { font-style:normal; font-size:11px; color:var(--muted); }
  .start { margin:14px 16px 0; display:flex; align-items:center; gap:14px; width:calc(100% - 32px); border:0; border-radius:20px; cursor:pointer; text-align:left;
           background:linear-gradient(120deg, var(--amber) 0%, #F59E0B 100%); color:#fff; padding:16px 18px; box-shadow:0 8px 20px rgba(224,145,58,.35); }
  .start .pl { width:48px; height:48px; border-radius:14px; background:rgba(255,255,255,.22); display:grid; place-items:center; font-size:30px; flex:none; }
  .start b { display:block; font-size:18px; } .start small { font-size:13px; opacity:.92; }
  .start .ar { margin-left:auto; font-size:26px; }
  .kpis { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 16px 0; }
  .kpi { background:#fff; border:1px solid #E2E8F0; border-radius:18px; padding:14px; position:relative; overflow:hidden; }
  .kpi small { color:var(--muted); font-size:12px; font-weight:600; }
  .kpi b { display:block; font-size:19px; font-weight:800; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .kpi span { font-size:12px; color:var(--muted); }
  .kpi::before { content:""; position:absolute; left:0; top:14px; bottom:14px; width:4px; border-radius:0 4px 4px 0; background:var(--k, var(--teal)); }
  .blk { margin:22px 16px 0; }
  .blk .hd { display:flex; align-items:baseline; justify-content:space-between; margin:0 2px 10px; }
  .blk .hd h3 { margin:0; font-size:18px; font-weight:800; }
  .blk .hd a { color:var(--teal); font-weight:700; font-size:14px; cursor:pointer; }
  .flow { background:#fff; border:1px solid #E2E8F0; border-radius:18px; overflow:hidden; }
  .flow button { display:flex; align-items:center; gap:12px; width:100%; border:0; background:none; padding:12px 14px; cursor:pointer; text-align:left;
                 border-bottom:1px solid #F8FAFC; font-size:15px; color:var(--ink); }
  .flow button:last-child { border-bottom:0; }
  .flow .ic { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; flex:none; }
  .flow .lb { flex:1; min-width:0; } .flow .lb small { display:block; color:var(--muted); font-size:12px; }
  .flow .ct { min-width:30px; height:30px; border-radius:15px; display:grid; place-items:center; font-weight:800; font-size:14px; padding:0 9px; }
  .flow .ch { color:#B0BCBB; font-size:20px; }
  .tl { position:relative; padding-left:18px; }
  .tl::before { content:""; position:absolute; left:6px; top:6px; bottom:6px; width:2px; background:#D6E2E1; }
  .tl .it { position:relative; background:#fff; border:1px solid #E2E8F0; border-radius:14px; padding:11px 12px; margin-bottom:9px; cursor:pointer; }
  .tl .it::before { content:""; position:absolute; left:-17px; top:16px; width:10px; height:10px; border-radius:50%; background:var(--d, var(--teal)); box-shadow:0 0 0 3px var(--bg); }
  nav.bottom.tabs .in { position:relative; }
  nav.bottom.tabs button { font-size:11px; gap:2px; padding:8px 2px 7px; }
  nav.bottom.tabs button svg { width:25px; height:25px; }
  nav.bottom.tabs button.on svg { stroke:var(--teal); }
  nav.bottom.tabs button.plus { flex:0 0 76px; }
  nav.bottom.tabs button.plus i { width:56px; height:56px; margin-top:-26px; border-radius:18px; background:var(--amber); color:#fff; font-style:normal; font-size:32px;
                                  display:grid; place-items:center; box-shadow:0 6px 16px rgba(224,145,58,.45); transform:rotate(45deg); }
  nav.bottom.tabs button.plus i span { transform:rotate(-45deg); line-height:1; }
  .tiles { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-top:6px; }
  .tiles button { border:1px solid var(--line); background:#F7FAFA; border-radius:16px; padding:16px 6px; font-size:13px; font-weight:600; color:var(--ink);
                  display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; }
  .tiles button b { font-size:26px; }
  .filterbar { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .filterbar .pill { font-size:13px; padding:6px 12px; }
  .filterbar button { border:0; background:none; color:var(--red); font-weight:700; cursor:pointer; }
  .orow { display:flex; align-items:center; gap:12px; padding:10px 6px; border-bottom:1px solid #F8FAFC; cursor:pointer; }
  .orow:last-child { border-bottom:0; } .orow:active { background:#F3F8F7; }
  .orow .oi { width:38px; height:38px; border-radius:11px; background:#E2E8F0; color:var(--teal); display:grid; place-items:center; font-size:18px; font-weight:800; flex:none; }
  .orow .ot { font-weight:700; font-size:15px; } .orow .oc { color:#9CA3AF; font-size:22px; }
  .tools { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
  .tools button { border:2px solid var(--teal); background:#fff; color:var(--teal); border-radius:14px; padding:10px 4px; font-weight:800; font-size:13px; cursor:pointer; }
  .tools button small { display:block; font-weight:600; font-size:11px; color:var(--muted); margin-top:2px; }
  svg .pnl, svg .cel { cursor:pointer; }
  #fb svg text, #fb svg line, #fb svg circle, #fb svg path { pointer-events:none; }
  #fb svg .kmb circle { pointer-events:auto; cursor:pointer; }
  nav.bottom .nlbl, nav.bottom .brand { display:none; }
  nav.side { display:none; position:fixed; left:0; top:0; bottom:0; width:228px; z-index:6; background:#0F172A; flex-direction:column; gap:2px;
             padding:calc(env(safe-area-inset-top) + 16px) 12px 14px; overflow-y:auto; }
  nav.side .brand { display:flex; align-items:center; gap:10px; color:#fff; padding:4px 8px 16px; }
  nav.side .brand b { font-size:16px; display:block; } nav.side .brand small { color:#F59E0B; font-weight:800; font-size:11px; letter-spacing:1.5px; }
  nav.side button { display:flex; align-items:center; gap:12px; border:0; background:none; color:#CBD5E1; font:inherit; font-size:14.5px; padding:9px 12px; border-radius:10px; cursor:pointer; text-align:left; }
  nav.side button svg { width:20px; height:20px; flex:none; stroke:#94A3B8; }
  nav.side button:hover { background:#1E293B; color:#fff; }
  nav.side button.on { background:#1E3A5F; color:#fff; font-weight:700; box-shadow:inset 3px 0 0 #F59E0B; } nav.side button.on svg { stroke:#fff; }
  nav.side .snew { background:#F59E0B; color:#fff; font-weight:800; justify-content:center; padding:11px; margin-bottom:6px; }
  nav.side .snew:hover { background:#D97706; } nav.side .snew span { font-size:20px; line-height:1; }
  nav.side .sfind { border:1px solid #334155; color:#94A3B8; margin-bottom:6px; }
  nav.side .sfind span { flex:1; } nav.side kbd { font:600 11px ui-monospace,monospace; color:#94A3B8; border:1px solid #334155; border-radius:5px; padding:1px 5px; }
  nav.side .ssec { color:#64748B; font-size:11px; font-weight:800; letter-spacing:1.4px; padding:14px 12px 4px; }
  nav.side .sfoot { margin-top:auto; color:#475569; font-size:11.5px; padding:14px 12px 0; }
  .pal { position:fixed; inset:0; z-index:40; background:rgba(15,23,42,.45); display:flex; justify-content:center; align-items:flex-start; padding:12vh 16px 16px; }
  .pal .pbox { width:100%; max-width:600px; background:#fff; border-radius:16px; box-shadow:0 24px 60px rgba(15,23,42,.35); overflow:hidden; }
  .pal input { width:100%; border:0; border-bottom:1px solid var(--line); padding:18px 20px; font-size:18px; outline:none; }
  .pal .pres { max-height:52vh; overflow:auto; padding:6px; }
  .pal .pres button { display:flex; width:100%; align-items:baseline; gap:10px; border:0; background:none; padding:10px 14px; border-radius:10px; text-align:left; cursor:pointer; font:inherit; color:var(--ink); }
  .pal .pres button b { font-size:15px; } .pal .pres button small { color:var(--muted); font-size:12.5px; margin-left:auto; text-align:right; }
  .pal .pres button.on { background:#FEF3C7; }
  .pal .pnone { padding:18px; color:var(--muted); text-align:center; }
  .pal .pft { display:flex; gap:16px; padding:9px 16px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; }
  @media (hover:hover) { .card.tap:hover, .tl .it:hover, .qgrid button:hover { border-color:#CBD5E1; box-shadow:0 4px 14px rgba(15,23,42,.08); } .flow button:hover, .orow:hover { background:#F8FAFC; } }
  /* Hızlı Keşif: telefonda tek sütun, bilgisayarda solda form sağda sabit çizim */
  .ksg { display:flex; flex-direction:column; } .ksg > .ksL, .ksg > .ksR { display:contents; }
  .hgrid { display:block; }
  /* ---- TABLET (iPad / Android tablet): solda koyu menü, geniş içerik, çok sütunlu listeler ---- */
  @media (min-width:768px) {
    body { padding-left:228px; }
    #app { max-width:1320px; }
    nav.bottom { display:none !important; }
    nav.side { display:flex; }
    header.top { background:var(--bg); color:var(--teal-d); box-shadow:none; border-bottom:1px solid var(--line); padding-top:calc(env(safe-area-inset-top) + 14px); }
    header.top h1 { font-size:22px; font-weight:800; }
    header.top .ib { background:#fff; color:var(--teal-d); border:1px solid var(--line); }
    header.top .ib svg rect { fill:#1E293B; opacity:1; }
    header.top { padding-left:24px; padding-right:24px; }
    main { padding:20px 28px 40px; }
    .fab { right:28px; bottom:calc(24px + env(safe-area-inset-bottom)); }
    .wbar { left:228px; }
    body.nonav { padding-left:0; } body.nonav .wbar { left:0; }
    .list { grid-template-columns:1fr 1fr; gap:14px; }
    .kpis { grid-template-columns:repeat(4, 1fr); margin:18px 28px 0; }
    .topbar { padding:calc(env(safe-area-inset-top) + 16px) 28px 6px; } .greet { padding:6px 30px 2px; }
    .market, .start { margin-left:28px; margin-right:28px; } .start { width:calc(100% - 56px); }

function palette() {
  if (document.querySelector(".pal")) return;
  const screens = SIDE_MENU.flatMap(([, it]) => it).map(([k, n]) => ({ t: n, s: "Ekran", go: () => { location.hash = "#/" + k; } }));
  screens.unshift({ t: "Yeni İş", s: "Müşteri, ölçü ve çizim", go: () => projectForm() });
  const custs = byKind("customer").filter(c => c.data.name).map(c => ({ t: trTitle(c.data.name), s: ["Müşteri", c.data.phone, c.data.city].filter(Boolean).join(" · "), go: () => { location.hash = "#/customer/" + encodeURIComponent(c.key); } }));
  const projs = byKind("project").map(p => ({ t: p.data.name || "Proje", s: ["İş", custName(p.data.customer_key), statusName(p.data.status)].filter(Boolean).join(" · "), go: () => { location.hash = "#/project/" + encodeURIComponent(p.key); } }));
  const all = [...screens, ...custs, ...projs];
  const fold = x => String(x || "").toLocaleLowerCase("tr").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ı/g, "i");
  const m = document.createElement("div"); m.className = "pal";
  m.innerHTML = `<div class="pbox"><input id="palIn" placeholder="Ekran, müşteri ya da iş ara…" autocomplete="off"><div class="pres" id="palRes"></div><div class="pft"><span>↑↓ seç</span><span>Enter aç</span><span>Esc kapat</span></div></div>`;
  document.body.appendChild(m);
  let sel = 0, res = [];
  const close = () => { m.remove(); document.removeEventListener("keydown", key, true); };
  const draw = () => {
    const q = fold($("#palIn").value.trim());
    res = (q ? all.filter(x => fold(x.t + " " + x.s).includes(q)) : screens).slice(0, 12);
    sel = Math.min(sel, Math.max(0, res.length - 1));
    $("#palRes").innerHTML = res.length ? res.map((x, i) => `<button data-i="${i}" class="${i === sel ? "on" : ""}"><b>${esc(x.t)}</b><small>${esc(x.s)}</small></button>`).join("") : `<div class="pnone">Sonuç yok</div>`;
    $("#palRes").querySelectorAll("button").forEach(b => { b.onclick = () => { close(); res[+b.dataset.i].go(); }; b.onmousemove = () => { if (sel !== +b.dataset.i) { sel = +b.dataset.i; draw(); } }; });
  };
  const key = e => {
    if (e.key === "Escape") { e.preventDefault(); close(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); sel = Math.min(res.length - 1, sel + 1); draw(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(0, sel - 1); draw(); }
    else if (e.key === "Enter" && res[sel]) { e.preventDefault(); close(); res[sel].go(); }
  };
  document.addEventListener("keydown", key, true);
  m.onclick = e => { if (e.target === m) close(); };
  $("#palIn").oninput = () => { sel = 0; draw(); };
  draw(); $("#palIn").focus();
}
document.addEventListener("keydown", e => {
  if (!S.user) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === "k") { e.preventDefault(); palette(); }
  else if (k === "escape" && !document.querySelector(".pal")) { const mods = document.querySelectorAll(".modal"); if (mods.length) mods[mods.length - 1].remove(); }
});

function remaining(p) { return Math.max(num(p.data.sale_price) - num(p.data.paid), 0); }
function projectMatches(p, f) {
  if (!f) return true;
  if (f === "ODEME") return remaining(p) > 1 && ["ONAYLANDI", "URETIMDE", "MONTAJDA", "TESLIM"].includes(p.data.status);
  return p.data.status === f;

function aluKgPrice() {
  const b = S.bundle; if (!b || !b.contexts) return 0;
  const ctx = (b.contexts.KATLANIR_8MM || Object.values(b.contexts)[0] || {})["Eloksal"];
  const ps = ((ctx && ctx.materials) || []).map(m => num(m.price_kg)).filter(v => v > 0);
  return ps.length ? Math.max(...ps) : num(ctx && ctx.alu_fallback);
}
async function usdRate(force) {
  let c = null; try { c = JSON.parse(localStorage.getItem("cb_usd") || "null"); } catch (e) {}
  if (c && !force && Date.now() - c.t < 3 * 3600e3) return c;
  try {
    const r = await fetch("https://open.er-api.com/v6/latest/USD", { cache: "no-store" });
    const j = await r.json();
    if (j && j.rates && j.rates.TRY) { c = { v: j.rates.TRY, t: Date.now() }; try { localStorage.setItem("cb_usd", JSON.stringify(c)); } catch (e) {} }
  } catch (e) {}
  return c;
}

  $("#pwset").onclick = async e => {
    e.preventDefault();
    const email = $("#pe").value.trim();
    if (!email) return toast("E-posta yazın");
    loading(true, "E-posta gönderiliyor…");
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    loading(false);
    if (error) return toast("Gönderilemedi: " + error.message);
    sheet("E-posta gönderildi", `<p class="note" style="font-size:15px">${esc(email)} adresine şifre belirleme bağlantısı gönderildi.

      Sonraki girişlerde sadece e-posta ve şifre yeterli.</p><button class="btn" id="okm">Tamam</button>`, close => { $("#okm").onclick = close; });
  };
  const done = async data => { S.user = data.user; await loadAll(); location.hash = "#/home"; route(); engine(); };
  const pair = async () => {
    const code = $("#pc").value.replace(/\D/g, "");
    if (code.length !== 6) return toast("6 haneli kodu yazın");
    loading(true, "Bağlanıyor…");
    try {
      const r = await fetch(SUPABASE_URL + "/functions/v1/cb-pair", { method: "POST",
        headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY }, body: JSON.stringify({ action: "redeem", code }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.token_hash) { loading(false); return toast(j.error || "Kod kabul edilmedi"); }
      let res = await sb.auth.verifyOtp({ token_hash: j.token_hash, type: "magiclink" });
      if (res.error) res = await sb.auth.verifyOtp({ token_hash: j.token_hash, type: "email" });
      loading(false);
      if (res.error || !res.data || !res.data.user) return toast("Giriş olmadı: " + (res.error ? res.error.message : "") + " — yeni kod alın");

      localStorage.removeItem("cb_operator_key");
      done(res.data);
    } catch (e) { loading(false); toast("İnternet bağlantısını kontrol edin"); }

  $("#pc").onkeydown = e => { if (e.key === "Enter") pair(); };
  let sent = false;
  const send = async () => {
    const email = $("#em").value.trim();
    if (!email) return toast("E-posta yazın");
    loading(true, "E-posta gönderiliyor…");
    const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false, emailRedirectTo: location.origin + location.pathname } });
    loading(false);
    if (error) { toast("Gönderilemedi: " + error.message); return; }
    sent = true;
    $("#codebox").style.display = "";
    $("#go").textContent = "Giriş Yap";
    $("#lnote").innerHTML = "E-posta gönderildi. <b>Bağlantıya tıklamayın</b>; <b>en yeni</b> e-postadaki bağlantıya uzun basıp " +
      "<b>“Bağlantıyı kopyala”</b> deyin, yukarıya yapıştırıp <b>Giriş Yap</b>’a basın.";
    $("#code").focus();
  };
  const verify = async () => {
    const txt = $("#code").value.trim();
    if (!txt) return toast("Bağlantıyı yapıştırın");
    loading(true, "Giriş yapılıyor…");
    let res;
    const frag = txt.includes("#") ? txt.split("#")[1] : (txt.includes("?") ? txt.split("?")[1] : "");
    const q = new URLSearchParams(frag);
    if (q.get("refresh_token")) {
      res = await sb.auth.setSession({ access_token: q.get("access_token") || "", refresh_token: q.get("refresh_token") });
    } else if (q.get("token") || q.get("token_hash")) {
      res = await sb.auth.verifyOtp({ token_hash: q.get("token") || q.get("token_hash"), type: "magiclink" });
    } else {
      res = await sb.auth.verifyOtp({ email: $("#em").value.trim(), token: txt.replace(/\s/g, ""), type: "email" });
    }
    loading(false);
    const { data, error } = res;
    if (error || !data || !data.user) { toast("Giriş olmadı: " + (error ? error.message : "bağlantı geçersiz") + " — yeniden gönderin"); return; }
    localStorage.setItem("cb_access_mode", "admin");
    localStorage.removeItem("cb_operator_key");
    done(data);
  };
  $("#go").onclick = () => (sent ? verify() : send());
  $("#em").onkeydown = e => { if (e.key === "Enter" && !sent) send(); };
  $("#code").onkeydown = e => { if (e.key === "Enter") verify(); };
}

// ---------------------------------------------------------------- montaj planı
function montageView(filter) {
  S.tab = "montage";
  filter = filter || "upcoming";
  const updates = new Map([...S.recs.values()].filter(r => r.kind === "sysedit" && !r.deleted && r.data && r.data.op === "installation_status")
    .map(r => [Number(r.data.installation_id), r.data]));
  const all = ((S.bundle && S.bundle.installations) || []).map(x => {
    const update = updates.get(Number(x.id));
    return update ? { ...x, status: update.status, mobile_update: true } : x;
  }).sort((a, b) =>
    (String(a.install_date) + String(a.install_time)).localeCompare(String(b.install_date) + String(b.install_time)));
  const waiting = (S.bundle && S.bundle.installation_waiting) || [];
  const now = new Date(), pad = n => String(n).padStart(2, "0");
  const today = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  const done = x => x.status === "TAMAMLANDI";
  const rows = all.filter(x => filter === "today" ? x.install_date === today :
    filter === "done" ? done(x) : filter === "all" ? true : x.install_date >= today && !done(x) && x.status !== "IPTAL");
  const state = x => ({ TAMAMLANDI: ["Tamamlandı", "#16A34A"], ERTELENDI: ["Ertelendi", "#D97706"],
    IPTAL: ["İptal", "#E11D48"] }[x.status] || ["Planlandı", "#0F766E"]);
  const dateLabel = iso => {
    const d = new Date(iso + "T12:00:00");
    return isNaN(d) ? iso : d.toLocaleDateString("tr-TR", { weekday: "long", day: "numeric", month: "long" });
  };
  const groups = [];
  rows.forEach(x => { let g = groups[groups.length - 1]; if (!g || g.date !== x.install_date) { g = { date: x.install_date, rows: [] }; groups.push(g); } g.rows.push(x); });
  shell("Montaj Planı", `
    <div class="agenda-head">${[["upcoming", "Yaklaşan"], ["today", "Bugün"], ["done", "Tamamlanan"], ["all", "Tümü"]]
      .map(([k, n]) => `<button data-f="${k}" class="${filter === k ? "on" : ""}">${n}</button>`).join("")}</div>
    <div class="kv" style="margin-bottom:10px"><div><b>${rows.length}</b><small>Montaj</small></div><div><b>${rows.filter(done).length}</b><small>Tamamlandı</small></div></div>
    ${filter === "upcoming" && waiting.length ? `<div class="agenda-day">Planlanmayı Bekleyen İşler</div><div class="list">${waiting.map(x => `<div class="card tap agenda-card" data-k="${esc(x.project_key || "")}" style="--ag:#F59E0B">
      <div class="row"><div class="grow"><div class="t1">${esc(x.customer_name || "Müşteri")}</div><div class="t2">${esc(x.project_name || "Proje")}</div></div><span class="pill amber">${esc(statusName(x.status))}</span></div>
      <div class="agenda-meta">${[x.address, x.city].filter(Boolean).length ? `<span>${esc([x.address, x.city].filter(Boolean).join(", "))}</span>` : ""}</div></div>`).join("")}</div>` : ""}
    <div class="list">${groups.length ? groups.map(g => `<div class="agenda-day">${esc(dateLabel(g.date))}</div>${g.rows.map(x => {
      const st = state(x), phone = String(x.customer_phone || "").replace(/\D/g, "");
      const location = [x.address, x.city].filter(Boolean).join(", ");
      return `<div class="card agenda-card${x.project_key ? " tap" : ""}" data-k="${esc(x.project_key || "")}" style="--ag:${st[1]}">
        <div class="row"><div class="agenda-time">${esc(x.install_time || "--:--")}</div><div class="grow"><div class="t1">${esc(x.customer_name || "Müşteri")}</div>
        <div class="t2">${esc(x.project_name || "Montaj")}</div></div><span class="pill" style="color:${st[1]}">${st[0]}${x.mobile_update ? " · Bekliyor" : ""}</span></div>
        <div class="agenda-meta">${x.assigned_employee ? `<span>Ekip: ${esc(x.assigned_employee)}</span>` : ""}${location ? `<span>${esc(location)}</span>` : ""}</div>
        ${x.notes ? `<div class="t2" style="margin-top:8px">${esc(x.notes)}</div>` : ""}
        <div class="row" style="margin-top:10px;gap:8px">${phone ? `<a class="obtn grow" style="text-align:center;text-decoration:none" href="tel:${phone}" onclick="event.stopPropagation()">Ara</a>` : ""}
        ${x.id ? `<button class="obtn grow" data-inst="${x.id}">Durumu Güncelle</button>` : ""}</div></div>`;
    }).join("")}`).join("") : `<div class="empty">${filter === "upcoming" && waiting.length ? "Planlanmış montaj yok." : "Bu bölümde montaj kaydı yok."}</div>`}</div>`,
    { back: () => goTo("#/home") });
  document.querySelectorAll(".agenda-head button").forEach(b => b.onclick = () => montageView(b.dataset.f));
  document.querySelectorAll("[data-inst]").forEach(b => b.onclick = e => { e.stopPropagation(); montageStatusSheet(Number(b.dataset.inst), filter); });
  document.querySelectorAll(".agenda-card[data-k]").forEach(c => c.onclick = () => {
    if (c.dataset.k) { S.projBack = "#/montage"; location.hash = "#/project/" + encodeURIComponent(c.dataset.k); }
  });
}

function montageStatusSheet(installId, filter) {
  const inst = ((S.bundle && S.bundle.installations) || []).find(x => Number(x.id) === Number(installId));
  if (!inst) return toast("Montaj kaydı bulunamadı");
  const queued = S.recs.get("inst-" + installId);
  const current = queued && !queued.deleted ? queued.data.status : inst.status;
  const who = (S.bundle && S.bundle.person) || (S.user && S.user.email ? S.user.email.split("@")[0] : "Mobil ekip");
  sheet("Montaj Durumu", `
    <div class="card" style="margin-bottom:12px"><div class="t1">${esc(inst.customer_name || "Müşteri")}</div><div class="t2">${esc(inst.project_name || "Montaj")} · ${esc(inst.install_time || "Saat yok")}</div></div>
    <label class="f">Yeni durum</label><select class="f" id="mis">${[["PLANLANDI", "Planlandı"], ["TAMAMLANDI", "Tamamlandı"], ["ERTELENDI", "Ertelendi"], ["IPTAL", "İptal"]]
      .map(([k, n]) => `<option value="${k}"${k === current ? " selected" : ""}>${n}</option>`).join("")}</select>
    <label class="f">İşlemi yapan</label><input class="f" id="miw" value="${esc(who)}" placeholder="Ekip veya personel adı">
    <label class="f">Not</label><textarea class="f" id="min" placeholder="İsteğe bağlı açıklama"></textarea>
    <div class="note">Tamamlandı seçilirse masaüstünde proje durumu da Teslim olarak güncellenir.</div>
    <button class="btn" id="misave">DURUMU KAYDET</button>`, (close, root) => {
    root.querySelector("#misave").onclick = async () => {
      const status = root.querySelector("#mis").value;
      if (status === "TAMAMLANDI" && !confirm("Montaj tamamlandı ve proje Teslim olarak işaretlensin mi?")) return;
      const data = { op: "installation_status", installation_id: installId, status, updated_by: root.querySelector("#miw").value.trim() || "Mobil ekip",
        note: root.querySelector("#min").value.trim(), updated_at: new Date().toISOString() };
      loading(true, "Durum gönderiliyor…");
      try {
        await saveRec("inst-" + installId, "sysedit", data);
        const item = ((S.bundle && S.bundle.installations) || []).find(x => Number(x.id) === Number(installId));
        if (item) item.status = status;
        try { localStorage.setItem("cb_bundle", JSON.stringify(S.bundle)); } catch (e) {}
        close(); montageView(filter); toast("Durum kaydedildi; masaüstüne gönderilecek");
      } finally { loading(false); }
    };
  });
}

    .sort((a, b) => String(b.data.created_at || b.updated_at).localeCompare(String(a.data.created_at || a.updated_at)));

      <div style="text-align:right"><div class="money">${tl(p.data.sale_price)}</div><span class="pill ${p.origin === "mobile" ? "amber" : ""}">${esc(statusName(p.data.status))}</span></div></div></div>`).join("")

    document.querySelectorAll("#list .card").forEach(c => c.onclick = () => { S.projBack = location.hash || "#/projects"; location.hash = "#/project/" + encodeURIComponent(c.dataset.k); });
  };
  $("#q").oninput = draw; draw();
  if ($("#clr")) $("#clr").onclick = () => { location.hash = "#/projects"; };

// ---------------------------------------------------------------- toplu mesaj (WhatsApp)
// Her müşteri için WhatsApp mesaj yazılmış olarak açılır, gönder tuşuna kullanıcı basar (otomatik gönderim yok).
// Tanıtım şablonları sadece WhatsApp izni olan müşterilere gider. Gönderilenler bu telefonda hatırlanır.
const WA_TEMPLATES = [
  ["kampanya", "Kampanya / indirim", true, "Merhaba {ad}, {firma} olarak bu ay cam balkon, giyotin ve sürme sistemlerinde özel fiyatlarımız var. Ücretsiz keşif ve fiyat bilgisi için bu mesaja yazmanız yeterli. İyi günler dileriz."],
  ["bakim", "Bakım hatırlatma", true, "Merhaba {ad}, {firma} olarak cam balkonunuzun bakım zamanı geldi. Teker, fitil ve kilit kontrolü için uygun olduğunuz günü yazarsanız ekibimizi yönlendirelim. İyi günler dileriz."],
  ["teklif", "Teklif takibi", false, "Merhaba {ad}, {firma} olarak hazırladığımız {proje} teklifi ({tutar}) hakkında sormak istediğiniz bir şey var mı? Yardımcı olmaktan memnuniyet duyarız."],
  ["montaj", "Montaj günü bildirimi", false, "Merhaba {ad}, {proje} işinizin montajı {tarih} günü yapılacak. Uygun değilse lütfen bize yazın. İyi günler dileriz."],
  ["serbest", "Serbest mesaj", false, ""]];
const WA_FILTERS = [["Tümü", null], ["İzin verenler", "izin"], ["Teklif bekleyen", ["BEKLEMEDE", "OLCULDU", "TEKLIF_VERILDI"]],
  ["Devam eden", ["ONAYLANDI", "URETIMDE", "HAZIR", "MONTAJDA"]], ["Teslim edilmiş", ["TESLIM", "TAMAMLANDI"]]];
const WA_VARS = [["{ad}", "Ad"], ["{firma}", "Firma"], ["{proje}", "Son iş"], ["{tutar}", "Tutar"], ["{tarih}", "Montaj tarihi"]];
function waPhone(p) { let d = String(p || "").replace(/\D/g, ""); if (d.startsWith("00")) d = d.slice(2); if (d.startsWith("0")) d = "9" + d; else if (d.length === 10 && d.startsWith("5")) d = "90" + d; return d.length >= 11 ? d : ""; }
function waSent() { try { return JSON.parse(localStorage.getItem("wa_sent") || "{}"); } catch (e) { return {}; } }
function waMark(k) { try { const m = waSent(); m[k] = new Date().toISOString().slice(0, 10); localStorage.setItem("wa_sent", JSON.stringify(m)); } catch (e) {} }
function waRecipients() {
  const projs = byKind("project"), sent = waSent();
  return byKind("customer").map(c => {
    const ps = projs.filter(p => p.data.customer_key === c.key), p = ps[ps.length - 1];
    return { key: c.key, name: c.data.name || "", phone: c.data.phone || "", wa: waPhone(c.data.phone), city: c.data.city || "", izin: !!c.data.wa_izin,
      status: p ? p.data.status || "" : "", proje: p ? p.data.name || "" : "", tutar: p && num(p.data.sale_price) ? "₺" + Math.round(num(p.data.sale_price)).toLocaleString("tr-TR") : "",
      tarih: "", last: sent[c.key] || "" };
  }).sort((a, b) => a.name.localeCompare(b.name, "tr"));
}
function waRender(t, r) {
  const firma = (S.bundle && S.bundle.company) || "Tayfun Yapı";
  return t.replaceAll("{ad}", r.name || "Değerli müşterimiz").replaceAll("{firma}", firma).replaceAll("{proje}", r.proje || "işiniz")
    .replaceAll("{tutar}", r.tutar || "").replaceAll("{tarih}", r.tarih || "belirlenen").replace(" ()", "").replace(/  +/g, " ").trim();
}
function messagesView() {
  S.tab = "customers";
  const M = S.wa || (S.wa = { flt: "Tümü", sel: new Set(), tpl: "kampanya", text: WA_TEMPLATES[0][3], promo: true, q: "" });
  const all = waRecipients();
  shell("Toplu Mesaj", `
    <div class="card"><div class="t1" style="margin-bottom:8px">Mesaj</div>
      <select class="f" id="wTpl">${WA_TEMPLATES.map(t => `<option value="${t[0]}" ${t[0] === M.tpl ? "selected" : ""}>${esc(t[1])}</option>`).join("")}</select>
      <textarea class="f" id="wTxt" rows="5" style="min-height:120px">${esc(M.text)}</textarea>
      <div class="chips" style="gap:6px;margin:6px 0">${WA_VARS.map(v => `<button class="pill" data-v="${v[0]}" style="border:0;cursor:pointer">+ ${v[1]}</button>`).join("")}</div>
      <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin:6px 0"><input type="checkbox" id="wPromo" ${M.promo ? "checked" : ""}> Tanıtım mesajı (sadece izin verenlere gider)</label>
      <div class="t2" style="margin-top:6px">Önizleme</div><div id="wPrev" style="background:#E7F8EE;border-radius:12px;padding:10px 12px;font-size:14px;white-space:pre-wrap;margin-top:4px"></div></div>
    <div class="card" style="margin-top:10px"><div class="row"><div class="t1 grow">Alıcılar</div><span class="t2" id="wCnt"></span></div>
      <div class="filterbar" style="flex-wrap:wrap;margin-top:8px">${WA_FILTERS.map(f => `<span class="pill" data-f="${f[0]}" style="cursor:pointer">${f[0]}</span>`).join("")}</div>
      <input class="search" id="wQ" placeholder="🔍 Ad, telefon, ilçe" value="${esc(M.q)}">
      <div class="row" style="gap:8px;margin:6px 0"><button class="btn ghost" style="margin:0" id="wAll">Tümünü seç</button><button class="btn ghost" style="margin:0" id="wNone">Temizle</button></div>
      <div id="wList"></div></div>
    <div id="wSum" class="t2" style="margin:12px 4px"></div>
    <button class="btn" id="wGo" style="background:#1FA855">Gönderime Başla</button>
    <p class="note">WhatsApp her müşteri için mesaj yazılmış olarak açılır, gönder tuşuna siz basarsınız. Otomatik gönderim yapılmaz.</p>`,
    { back: () => goTo("#/customers") });
  const flt = () => (WA_FILTERS.find(f => f[0] === M.flt) || WA_FILTERS[0])[1];
  const visible = () => all.filter(r => { const f = flt(); if (f === "izin" && !r.izin) return false; if (Array.isArray(f) && !f.includes(r.status)) return false;
    const q = M.q.toLocaleLowerCase("tr"); return !q || (r.name + " " + r.phone + " " + r.city).toLocaleLowerCase("tr").includes(q); });
  const plan = () => { const ch = all.filter(r => M.sel.has(r.key)); return { ch, send: ch.filter(r => r.wa && (!M.promo || r.izin)), noPhone: ch.filter(r => !r.wa), noIzin: ch.filter(r => r.wa && M.promo && !r.izin) }; };
  const sum = () => {
    const P = plan(), sample = P.send[0] || P.ch[0] || all[0] || { name: "Ahmet Yılmaz", proje: "Balkon", tutar: "₺45.000" };
    $("#wPrev").textContent = waRender(M.text, sample) || "Mesaj yazın…";
    $("#wCnt").textContent = `${visible().length} müşteri · ${M.sel.size} seçili`;
    $("#wSum").textContent = P.ch.length ? [`${P.send.length} kişiye gidecek`, P.noPhone.length ? `${P.noPhone.length} kişinin telefonu yok` : "",
      P.noIzin.length ? `${P.noIzin.length} kişinin izni yok` : ""].filter(Boolean).join(" · ") : "Aşağıdan müşteri seçin.";
  };
  const draw = () => {
    document.querySelectorAll("[data-f]").forEach(x => { const on = x.dataset.f === M.flt; x.style.background = on ? "#1E293B" : ""; x.style.color = on ? "#fff" : ""; });
    const rows = visible();
    $("#wList").innerHTML = rows.length ? rows.map(r => `<div class="row" style="padding:8px 2px;border-bottom:1px solid #F8FAFC;gap:10px">
      <input type="checkbox" data-k="${esc(r.key)}" ${M.sel.has(r.key) ? "checked" : ""} style="width:22px;height:22px;flex:none">
      <div class="grow"><div style="font-weight:700">${esc(r.name)}</div><div class="t2" style="${r.wa ? "" : "color:#BE123C"}">${esc(r.phone || "telefon yok")}${r.city ? " · " + esc(r.city) : ""}${r.last ? " · son " + esc(r.last) : ""}</div></div>
      <button class="pill" data-iz="${esc(r.key)}" style="border:0;cursor:pointer;${r.izin ? "background:#DCFCE7;color:#166534" : "background:#F1F5F9;color:#64748B"}">${r.izin ? "İzin var" : "İzin yok"}</button></div>`).join("")
      : `<div class="empty">Bu filtrede müşteri yok.</div>`;
    document.querySelectorAll("#wList input[data-k]").forEach(x => x.onchange = () => { x.checked ? M.sel.add(x.dataset.k) : M.sel.delete(x.dataset.k); sum(); });
    document.querySelectorAll("#wList [data-iz]").forEach(x => x.onclick = async () => {
      const c = rec(x.dataset.iz); if (!c) return; const r = all.find(y => y.key === x.dataset.iz);
      loading(true, "Kaydediliyor…");
      try { await saveRec(c.key, "customer", { ...c.data, wa_izin: !c.data.wa_izin }); r.izin = !r.izin; } catch (e) {} finally { loading(false); }
      draw();
    });
    sum();
  };
  $("#wTpl").onchange = () => { const t = WA_TEMPLATES.find(x => x[0] === $("#wTpl").value); M.tpl = t[0]; M.promo = t[2]; M.text = t[3]; $("#wTxt").value = t[3]; $("#wPromo").checked = t[2]; sum(); };
  $("#wTxt").oninput = () => { M.text = $("#wTxt").value; sum(); };
  $("#wPromo").onchange = () => { M.promo = $("#wPromo").checked; sum(); };
  document.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { const ta = $("#wTxt"), i = ta.selectionStart ?? ta.value.length;
    ta.value = ta.value.slice(0, i) + b.dataset.v + ta.value.slice(i); M.text = ta.value; ta.focus(); sum(); });
  document.querySelectorAll("[data-f]").forEach(x => x.onclick = () => { M.flt = x.dataset.f; draw(); });
  $("#wQ").oninput = () => { M.q = $("#wQ").value; draw(); };
  $("#wAll").onclick = () => { visible().forEach(r => M.sel.add(r.key)); draw(); };
  $("#wNone").onclick = () => { visible().forEach(r => M.sel.delete(r.key)); draw(); };
  $("#wGo").onclick = () => {
    if (!M.text.trim()) { toast("Mesaj boş"); return; }
    const q = plan().send; if (!q.length) { toast(M.promo ? "İzinli ve telefonu olan müşteri seçin" : "Telefonu olan müşteri seçin"); return; }
    waRun(q, M);
  };
  draw();
}
function waRun(queue, M) {
  let i = 0, sent = 0;
  const link = r => `https://wa.me/${r.wa}?text=${encodeURIComponent(waRender(M.text, r))}`;
  sheet("Gönderim", `<div id="wr"></div>`, (close, root) => {
    const show = () => {
      if (i >= queue.length) { close(); toast(`${sent} / ${queue.length} mesaj gönderildi`); route(); return; }
      const r = queue[i];
      root.querySelector("#wr").innerHTML = `<div class="t2">${i + 1} / ${queue.length}</div>
        <div style="height:6px;background:#E5E7EB;border-radius:4px;margin:6px 0 12px"><div style="height:6px;width:${Math.round(i / queue.length * 100)}%;background:#1FA855;border-radius:4px"></div></div>
        <div class="t1">${esc(r.name)}</div><div class="t2">${esc(r.phone)}</div>
        <div style="background:#E7F8EE;border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0;white-space:pre-wrap">${esc(waRender(M.text, r))}</div>
        <a class="btn" id="wOpen" style="display:block;text-align:center;text-decoration:none;background:#1FA855" href="${link(r)}" target="_blank" rel="noopener">WhatsApp'ta Aç</a>
        <button class="btn" id="wNext">Gönderildi · Sıradaki</button>
        <div class="row" style="gap:8px"><button class="btn ghost" style="margin:0" id="wSkip">Atla</button><button class="btn ghost" style="margin:0;color:#BE123C" id="wStop">Bitir</button></div>`;
      root.querySelector("#wNext").onclick = () => { waMark(r.key); sent++; i++; show(); };
      root.querySelector("#wSkip").onclick = () => { i++; show(); };
      root.querySelector("#wStop").onclick = () => { i = queue.length; show(); };
    };
    show();
  });
}

// ---------------------------------------------------------------- teklif ve sözleşme formu
// İşten bağımsız: müşteri seçmeden ad yazılarak hazırlanır, kalemler elle ya da bir işten gelir.

async function htmlToPdf(html, name) {

}

}

function vtIrr(principal, pays) {

  const r = tsNum(f.monthly_rate) / 100, d = tsNum(f.money_cost) / 100, downPct = cl(tsNum(f.down_pct), 0, 100) / 100, step = tsNum(f.round_to);

// Hesap, bilgisayardaki tayfun_core/railing_engine.py'nin kendisiyle yapılır (paketle gelir, Pyodide'de çalışır).
// Fiyatlar bilgisayardaki Ürün Kataloğu → Küpeşte'den gelir. Kayıtlar bu cihazda tutulur.
function rlStore() { try { return JSON.parse(localStorage.getItem("rl_jobs") || "[]"); } catch (e) { return []; } }
function rlPut(list) { try { localStorage.setItem("rl_jobs", JSON.stringify(list.slice(0, 60))); } catch (e) {} }
async function rlPy() {
  if (!S.bundle || !S.bundle.src || !S.bundle.src["railing.py"]) throw new Error("Küpeşte hesabı için bilgisayardaki programda Ayarlar → Bulut Senkron yapın (program güncel olmalı).");
  const py = await engine();
  if (!S.rlMeta || S.rlMetaSrc !== S.pySrc) {
    S.rlMeta = JSON.parse(py.runPython(`import json, sys\nsys.modules.pop("railing", None)\nimport railing\njson.dumps({"profiles": railing.PROFILES, "presets": railing.PRESETS, "ends": railing.ENDS, "starts": railing.STARTS, "mounts": railing.MOUNTS, "glass": railing.GLASS_TYPES, "dirs": railing.INFILL_DIRS, "blank": railing.blank_job()})`));
    S.rlMetaSrc = S.pySrc;
  }
  return py;
}
async function rlCompute(job) {
  const py = await rlPy(), b = S.bundle.railing || {};
  const acc = { ...(b.acc || {}) };
  ((S.bundle.catalog || {}).general || []).forEach(g => { if (String(g.code || "").startsWith("KP_")) acc[g.code] = num(g.unit_price); });
  py.globals.set("_rl_args", JSON.stringify([job, b.cut || {}, { kg: (b.kg || {})[job.color] || {}, acc, glass: b.glass || {}, labor_m: b.labor_m || 0 }]));
  return JSON.parse(py.runPython("import json, railing\n_a = json.loads(_rl_args)\n_r = railing.compute(*_a)\njson.dumps({'res': _r, 'desc': railing.describe(_a[0]), 'dres': railing.drawing_result(_a[0], _r), 'dprops': railing.drawing_props(_a[0])})"));
}
function rlImg(a, size) {
  // aksesuar fotoğrafı (Ekol aksesuar kataloğu; bilgisayardaki programdan pakete gelir)

function rlBlank(cust) {

}
function rlSpec(preset, job) {
  const posts = ["1272", "1128", "1338", "1357", "1273", "1375"];
  if (preset === "yuvarlak") {
    const s = [["top", "Küpeşte (üst baza)", ["1067", "1065", "1066"]], ["post_mid", "Ayak (70 cm arayla)", ["1070", "1070-B", "1070-C", "1076"]],

    ["post_mid", "Ara dikme", posts], ["post_end", "Uç dikme", posts], ["post_corner", "Köşe dikme", posts]];

  else { s.push(["post_mid", "Ara dikme", posts], ["post_end", "Uç dikme", posts], ["post_corner", "Köşe dikme", posts]); if (preset === "bariyer") s.push(["rail_bottom", "Alt yatay", ["1335", "1273"]]); }

function rlSvg(res, job, opts = {}) {
  // açılım: cepheler yan yana, köşelerde ayrık; ölçüler mm
  const lay = res.layout || [], H = res.height, rh = res.rail_h, gap = 300;
  const total = lay.reduce((a, s) => a + s.L, 0) + gap * Math.max(lay.length - 1, 0);
  if (!total) return "";
  const fs = Math.max(total / 38, 70), top = fs * 1.4, Ht = H + top + fs * 2.2;
  const navy = "#1E293B", glass = "#CFF3F8", gl = "#7DD3E2", bar = "#64748B";
  const y = v => top + H - v;  // yerden yükseklik → svg y
  let x0 = 0, out = "";
  const R = (x, yy, w, h, fill, stroke) => `<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${Math.max(w, 0.1).toFixed(1)}" height="${Math.max(h, 0.1).toFixed(1)}" fill="${fill}"${stroke ? ` stroke="${stroke}" stroke-width="${(total / 900).toFixed(1)}"` : ""}/>`;
  for (const s of lay) {
    const L = s.L;
    out += `<line x1="${x0 - 40}" y1="${y(0)}" x2="${x0 + L + 40}" y2="${y(0)}" stroke="#94A3B8" stroke-width="${total / 500}"/>`;
    if (job.preset === "bazali") {
      (s.glass || []).forEach(([gx, gw]) => out += R(x0 + gx, y(H - rh), gw, H - rh, glass, gl));
      out += R(x0, y(s.base_h || 60), L, s.base_h || 60, navy);
    } else {
      const gy = s.glass_y || 100;
      (s.glass || []).forEach(([gx, gw]) => out += R(x0 + gx, y(H - rh), gw, H - rh - gy, glass, gl));
      const ry = s.rail_bottom_y || 100, rbh = s.rb_h || 25, bw = s.bar_w || 14;
      if ((s.bars || []).length) (s.bays || []).forEach(([bx, w]) => out += R(x0 + bx, y(ry + rbh), w, rbh, navy));
      (s.bars || []).forEach(bx => out += R(x0 + bx, y(H - rh), bw, H - rh - ry - rbh, bar));
      (s.hrows || []).forEach(hy => (s.bays || []).forEach(([bx, w]) => out += R(x0 + bx, y(hy + bw), w, bw, bar)));
      if (s.bottom_h) (s.bays || []).forEach(([bx, w]) => out += R(x0 + bx, y(s.bottom_h), w, s.bottom_h, navy));
      (s.posts || []).forEach(([px, pw]) => out += R(x0 + px, y(H - rh), pw, H - rh, navy));
    }
    out += R(x0, y(H), L, rh, navy);
    out += `<text x="${x0 + L / 2}" y="${y(0) + fs * 1.4}" font-size="${fs}" text-anchor="middle" font-weight="700" fill="${opts.ink || "#111"}">${esc(s.label)}  ${Math.round(L)}${s.stair ? "  merdiven" : ""}</text>`;
    if (String(s.end || "").includes("köşe")) out += `<text x="${x0 + L + gap / 2}" y="${y(H / 2)}" font-size="${fs * 0.8}" text-anchor="middle" fill="#64748B">${esc(String(s.end).split(" ")[0])}</text>`;
    x0 += L + gap;
  }
  out += `<text x="0" y="${fs}" font-size="${fs * 0.85}" fill="#64748B">H ${Math.round(H)}</text>`;
  return `<svg viewBox="-60 0 ${total + 120} ${Ht}" style="width:100%;height:auto;display:block;background:#fff;border-radius:8px">${out}</svg>`;
}

function applySysEdits() { if (!S.bundle) return; pendingSys().forEach(r => { try { applySysEdit(r.data); } catch (e) {} }); }
function applySysEdit(d) {
  const c = catalog(), ctxs = (S.bundle && S.bundle.contexts) || {};
  const touched = new Set();
  const setProfile = (code, pcode, color, price, kg) => {
    const se = c && c.series[code], p = se && se.profiles.find(x => x.code === pcode);
    if (p && c.price_stats) {   // renk ortalaması (fiyatsız profillerin kullandığı) masaüstüyle aynı kalsın
      const st = c.price_stats[color] || (c.price_stats[color] = [0, 0]), stored = p.stored || (p.stored = []);
      const old = stored.includes(color) ? num((p.prices[color] || [0])[0]) : 0;
      if (old > 0) { st[0] -= old; st[1] -= 1; }
      if (price > 0) { st[0] += price; st[1] += 1; }
      if (!stored.includes(color)) stored.push(color);
      touched.add(color);
    }
    if (p) p.prices[color] = [price, kg];
    const ctx = (ctxs[code] || {})[color]; if (!ctx) return;
    const info = ctx.profile_info && ctx.profile_info[pcode];
    if (info) { info.price_kg = price; info.kg = kg; }
    const name = p ? p.name : (info || {}).name;
    (ctx.materials || []).forEach(m => { if (m.name === name) { m.price_kg = price; m.kg = kg; } });
  };
  const refreshFallback = () => touched.forEach(color => {
    const st = c.price_stats && c.price_stats[color]; if (!st || st[1] <= 0) return;
    const avg = st[0] / st[1];
    Object.values(ctxs).forEach(per => { const ctx = per[color]; if (ctx) ctx.alu_fallback = avg; });
  });
  if (d.op === "color_price") { Object.entries(d.prices || {}).forEach(([col, pr]) => setProfile(d.system_code, d.profile_code, col, +pr[0], +pr[1])); refreshFallback(); }
  else if (d.op === "alu_price") { (d.system_codes || []).forEach(code => {
    const se = c && c.series[code]; (se ? se.profiles : []).forEach(p => setProfile(code, p.code, d.color, +d.price, (p.prices[d.color] || [0, 0])[1])); }); refreshFallback(); }
  else if (d.op === "lib_price") {
    if (c) [...(c.general || []), ...(c.glass || [])].forEach(it => { if (it.code === d.code) it.unit_price = +d.price; });
    if (c) Object.values(c.series).forEach(se => (se.accessories || []).forEach(a => { if (a.code === d.code) a.price = +d.price; }));
    Object.values(ctxs).forEach(per => Object.values(per).forEach(ctx => { if (ctx.accessories && d.code in ctx.accessories) ctx.accessories[d.code] = +d.price; }));
    (S.bundle.glass || []).forEach(g => { if (d.name && g.name === d.name) g.unit_price = +d.price; });
  } else if (d.op === "series") {
    const se = c && c.series[d.system_code], v = d.values || {};
    if (se) se.settings = { ...se.settings, ...v };
    Object.values(ctxs[d.system_code] || {}).forEach(ctx => {
      ctx.series_m2_price = num(v.m2_price);
      if (num(v.m2_montaj) > 0) ctx.labor_m2 = num(v.m2_montaj);
      if (v.series_name) ctx.series_name = v.series_name;
    });
    const sl = (S.bundle.systems || []).find(x => x.code === d.system_code); if (sl && v.series_name) sl.name = v.series_name;
  } else if (d.op === "roles") {
    const se = c && c.series[d.system_code]; if (se) se.roles = { ...se.roles, ...(d.roles || {}) };
    Object.values(ctxs[d.system_code] || {}).forEach(ctx => { ctx.roles = { ...(ctx.roles || {}), ...(d.roles || {}) }; });
  }
}

function sheet(title, body, init) {
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<div class="sheet"><div class="grab"></div><h2><span>${esc(title)}</span><button class="x">✕</button></h2>${body}</div>`;
  document.body.appendChild(m);

  m.querySelector(".x").onclick = close;

  init && init(close, m);
  const first = m.querySelector("input.f"); if (first && !("ontouchstart" in window)) first.focus();
  return close;
}

function openDrawing(key) {
  if (W && W.key === key) return wizard();
  const r = rec(key);
  if (!r) { location.hash = "#/projects"; return; }
  if (r.data.system_code === RAIL_SYS.code) return openRailingDrawing(key);
  W = { key, isNew: false, step: 2, d: JSON.parse(JSON.stringify(r.data)), result: r.data.result || null };
  W.d.props = { ...DEFAULT_PROPS, ...(W.d.props || {}) };
  wizard();
}
function kind() { return sysKind(W.d.system_code); }
function thicknessOptions() {
  const k = kind(), c = W.d.system_code;
  if (k === "folding") return c.includes("ISICAM") ? ["4+12+4", "4+16+4", "4+20+4", "4+22+4"] : ["8mm", "10mm"];
  if (k === "sliding") return c.includes("8MM") ? ["8mm", "10mm"] : ["4+12+4", "4+16+4", "4+20+4", "4+22+4"];
  if (k === "guillotine") return ["4+12+4", "4+16+4", "4+20+4", "4+22+4"];
  if (k === "aldox") return ["6mm", "8mm", "4+12+4", "4+16+4", "4+20+4"];
  return ["8mm", "4+12+4"];
}
function fixThickness() { const o = thicknessOptions(); if (!o.includes(W.d.props.glass_thickness)) W.d.props.glass_thickness = o[0]; }

function wizard() {
  const titles = ["Sistem & Renk", "Ölçüler", "Çizim", "Fiyat & Kayıt"];
  const steps = [0, 1, 2, 3].map(i => `<span class="${i === W.step ? "on" : i < W.step ? "done" : ""}">${i < W.step ? "✓" : i === W.step ? (i + 1) + " · " + titles[i] : i + 1}</span>`).join("<i></i>");
  shell(titles[W.step], `<div class="steps">${steps}</div>
    <select class="f" id="sysSel" style="margin-bottom:8px">${sysList().map(s => `<option value="${s.code}" ${s.code === W.d.system_code ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select>
    <div id="wbody"></div>`, {
      nav: false, back: () => leaveWizard(),
      right: `<button class="ib" id="delD" title="Sil" style="${W.isNew ? "visibility:hidden" : ""}">🗑</button>`,
      after: `<div class="wbar"><div class="in"><button class="back" id="wb">${W.step === 0 ? "Vazgeç" : "‹ Geri"}</button>
              <button class="next" id="wn">${W.step === 3 ? "Kaydet ✓" : "Devam ›"}</button></div></div>` });
  $("#sysSel").onchange = e => { W.d.system_code = e.target.value; fixThickness(); W.result = null; wizard(); };
  $("#wb").onclick = () => { if (W.step === 0) leaveWizard(); else { W.step--; wizard(); } };
  $("#wn").onclick = () => nextStep();
  const del = $("#delD"); if (del) del.onclick = async () => {
    if (!confirm("Bu çizim silinsin mi?")) return;
    const r = rec(W.key); await sb.from("cb_records").upsert({ key: W.key, kind: "drawing", data: r.data, origin: "mobile", deleted: true }, { onConflict: "key" });
    S.recs.delete(W.key); const pk = W.d.project_key; W = null; goTo("#/project/" + encodeURIComponent(pk));
  };
  [stepProps, stepSizes, stepDraw, stepFinish][W.step]();
}
function leaveWizard() {
  const pk = W.d.project_key, k = W.key, saved = !W.isNew && rec(k); W = null;
  goTo(saved ? "#/item/" + encodeURIComponent(k) : "#/project/" + encodeURIComponent(pk));
}
async function nextStep() {
  if (W.step === 1 && !W.d.segments.length) { toast("En az 1 ölçü ekleyin"); return; }
  if (W.step === 3) return saveDrawing();
  W.step++; wizard();
}

function section(title, html) { return `<div class="sec"><h3>${esc(title)}</h3><div class="in">${html}</div></div>`; }
function chips(id, options, current) { return `<div class="chips" data-chips="${id}">${options.map(o => `<button class="chip ${o === current ? "on" : ""}" data-v="${esc(o)}">${o === current ? "✓ " : ""}${esc(o)}</button>`).join("")}</div>`; }
function bindChips(root, id, onPick) {
  const box = root.querySelector(`[data-chips="${id}"]`); if (!box) return;
  box.querySelectorAll(".chip").forEach(b => b.onclick = e => {
    e.preventDefault();
    box.querySelectorAll(".chip").forEach(x => { x.classList.remove("on"); x.textContent = x.dataset.v; });
    b.classList.add("on"); b.textContent = "✓ " + b.dataset.v; onPick(b.dataset.v);
  });
}
function checkbox(key, text) { return `<label class="check"><input type="checkbox" data-prop="${key}" ${W.d.props[key] ? "checked" : ""}>${esc(text)}</label>`; }

function stepProps() {
  const p = W.d.props, k = kind();
  let other = "";
  if (k === "folding") {
    other += section("Profil Özelliği", chips("curtain", ["Yok", "Perdelik Profil", "Geniş Perdelik Profil"], p.curtain || "Yok"));
    other += section("Diğer", checkbox("espagnolette", "İspanyolet Kol") + checkbox("drip", "Harici Damlalık Profil") + checkbox("mounted", "Montajlı"));
  } else if (k === "sliding") {
    other += section("Eşik", chips("threshold", ["Eşikli", "Eşiksiz"], p.threshold || "Eşikli"));
    other += section("Kilit", chips("lock", ["Standart Kilit", "Fotoselli Kilit"], p.lock || "Standart Kilit"));
    other += section("Diğer", checkbox("espagnolette", "İspanyolet Kol") + checkbox("mounted", "Montajlı"));
  } else if (k === "guillotine") {
    p.motor_model = p.motor_model || "MOSEL 120 NM E";
    other += section("Motor", chips("motor_model", ["MOSEL 120 NM E", "MOSEL 140 NM E", "MOSEL 120 NM R", "MOSEL 140 NM R",

function aldoxCellForm(si, key) {
  const sg = W.d.segments[si], [r, c] = key.split(",").map(Number);
  const cols = Math.max(parseInt(sg.cols) || 1, 1), rows = Math.max(parseInt(sg.rows) || 1, 1), wd = num(sg.width), ht = num(sg.height);
  let colW = (sg.col_w || []).map(num), rowH = (sg.row_h || []).map(num);
  if (colW.length !== cols || Math.abs(colW.reduce((a, b) => a + b, 0) - wd) > 1) colW = Array(cols).fill(wd / cols);
  if (rowH.length !== rows || Math.abs(rowH.reduce((a, b) => a + b, 0) - ht) > 1) rowH = Array(rows).fill(ht / rows);
  const cur = (sg.cells || {})[key] || "Sabit";
  sheet("Parça Düzenle", section("Parça Tipi", chips("aType", ALDOX_TYPES, cur)) + `
    <label class="f">Bölme Genişliği (sütun ${c + 1}) mm</label><input class="f" id="aW" inputmode="decimal" value="${mm(colW[c])}" ${cols === 1 ? "disabled" : ""}>
    <label class="f">Bölme Yüksekliği (satır ${r + 1}) mm</label><input class="f" id="aH" inputmode="decimal" value="${mm(rowH[r])}" ${rows === 1 ? "disabled" : ""}>
    <button class="btn" id="aSave">KAYDET</button>`, (close, m) => {
    let v = cur; bindChips(m, "aType", x => v = x);
    const resize = (sizes, idx, nw, total) => {
      if (sizes.length === 1 || nw <= 0) return sizes;
      nw = Math.min(Math.max(nw, 150), total - 150 * (sizes.length - 1));
      const rest = sizes.map((_, i) => i).filter(i => i !== idx), share = rest.reduce((a, i) => a + sizes[i], 0) || 1;
      return sizes.map((x, i) => i === idx ? nw : Math.round((total - nw) * x / share * 10) / 10);
    };
    m.querySelector("#aSave").onclick = () => {
      sg.cells = { ...(sg.cells || {}), [key]: v };
      if (cols > 1) sg.col_w = resize(colW, c, num(m.querySelector("#aW").value), wd);
      if (rows > 1) sg.row_h = resize(rowH, r, num(m.querySelector("#aH").value), ht);
      close(); redraw();
    };
  });
}

// müşteriye gönderilen 3B paylaşım linki (…/?id=XXXX): giriş istemeden 3B görüntüleyiciyi açar
async function openShared3d() {
  $("#app").innerHTML = `<div class="empty" style="margin-top:40vh">3B görünüm yükleniyor…</div>`;
  try {
    const { data, error } = await sb.from("cb_records").select("data").eq("key", "viewer_web").maybeSingle();
    if (error || !data || !data.data || !data.data.z) throw new Error("yok");
    const bin = Uint8Array.from(atob(data.data.z), c => c.charCodeAt(0));
    const html = await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    document.open(); document.write(html); document.close();
  } catch (e) {
    $("#app").innerHTML = `<div class="empty" style="margin-top:35vh">Görünüm yüklenemedi. Sayfayı yenileyin.<br><br><a href="https://wa.me/905453023591">Tayfun Yapı ile iletişime geçin</a></div>`;
  }
}

    const q = new URLSearchParams(location.hash.slice(1));
    recovery = q.get("type") === "recovery";
    try { await sb.auth.setSession({ access_token: q.get("access_token") || "", refresh_token: q.get("refresh_token") || "" }); } catch (e) {}
    localStorage.setItem("cb_access_mode", "admin");
    localStorage.removeItem("cb_operator_key");
    history.replaceState(null, "", location.pathname + "#/home");
  }
  const { data } = await sb.auth.getSession();
  S.user = data.session ? data.session.user : null;
  if (S.user) { await loadAll(); engine(); }
  route();
  if (S.user && recovery) passwordSheet(true);
})();
</script>
